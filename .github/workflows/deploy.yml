# Builds the live version of the site and uploads it to Misshosting over FTPS.
#
# - Every push to master goes to staging.kbt-konsulterna.se.
# - The live site only goes up when started by hand: Actions > Deploy >
#   Run workflow > target "live".
#
# The FTP logins live in two GitHub environments, "staging" and "live", each
# with the secrets FTP_USER and FTP_PASS and the variables FTP_HOST and FTP_DIR.
# See README.md, "Deploying".
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      target:
        description: Where to upload
        type: choice
        options: [staging, live]
        default: staging

# One upload at a time; a newer push waits for the running one to finish.
concurrency:
  group: deploy-${{ inputs.target || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Build and upload
        env:
          FTP_HOST: ${{ vars.FTP_HOST }}
          FTP_DIR: ${{ vars.FTP_DIR }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          # Only set when someone chose "live" by hand.
          DEPLOY_CONFIRM: ${{ inputs.target == 'live' && 'live' || '' }}
        run: tools/deploy.sh ${{ inputs.target == 'live' && 'live' || 'test' }}
